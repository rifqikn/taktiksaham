<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaktikSaham — Live Display</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#071a36;color:#fff;overflow:hidden}.board{width:100%;height:100%;padding:clamp(28px,3.2vw,58px);display:flex;flex-direction:column;background:linear-gradient(145deg,#06162f,#0d315f)}.head{display:flex;justify-content:space-between;gap:28px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.14)}.label{font-size:clamp(16px,1.3vw,22px);font-weight:950;color:#ffd18e;letter-spacing:1.5px}.title{font-size:clamp(58px,6.5vw,118px);font-weight:1000;line-height:.94;letter-spacing:-3px;margin:14px 0 10px}.subtitle{font-size:clamp(22px,2vw,36px);line-height:1.22;color:#d5dfeb}.clock{text-align:right;color:#a6b8cf;font-size:clamp(15px,1.2vw,22px)}.clock b{display:block;color:#fff;font-size:clamp(28px,2.8vw,52px);margin-bottom:7px}.notes{display:grid;gap:clamp(16px,1.6vw,26px);margin-top:28px;overflow:auto;flex:1;align-content:start}.note{display:grid;grid-template-columns:minmax(210px,1.05fr) minmax(180px,.7fr) minmax(220px,1fr);grid-template-areas:"ticker stance level" "note note note";gap:18px;padding:clamp(22px,2vw,34px);border:1px solid rgba(255,255,255,.16);border-radius:28px;background:rgba(255,255,255,.085)}.ticker{grid-area:ticker;font-size:clamp(58px,5.4vw,102px);font-weight:1000;line-height:.9}.stance{grid-area:stance;justify-self:start;align-self:center;background:#eaf3ff;color:#235f9c;border-radius:999px;padding:15px 22px;font-size:clamp(22px,2vw,38px);font-weight:1000}.level{grid-area:level;text-align:right;color:#ffd18e;font-size:clamp(42px,4vw,76px);font-weight:1000;line-height:.95}.note-text{grid-area:note;font-size:clamp(32px,3vw,58px);font-weight:900;line-height:1.12}.empty{display:grid;place-items:center;min-height:45vh;color:#9db0c8;font-size:clamp(28px,2.5vw,48px);font-weight:800}.fs{position:fixed;right:18px;top:18px;z-index:100;border:1px solid rgba(255,255,255,.2);background:rgba(5,18,39,.88);color:#fff;border-radius:12px;padding:12px 16px;font-weight:950;cursor:pointer}:fullscreen .fs{display:none}@media(max-width:900px){.board{padding:24px;overflow:auto}.head{display:block}.clock{text-align:left;margin-top:18px}.title{font-size:64px}.subtitle{font-size:24px}.note{grid-template-columns:1fr auto;grid-template-areas:"ticker stance" "level level" "note note";padding:24px}.ticker{font-size:68px}.level{text-align:left;font-size:48px}.note-text{font-size:38px}}
</style></head><body><button class="fs" id="fs">FULL SCREEN ⛶</button><div class="board"><header class="head"><div><div class="label"><span id="status">LIVE</span> • TAKTIKSAHAM</div><div class="title" id="title">LIVE MARKET NOTES</div><div class="subtitle" id="subtitle"></div></div><div class="clock"><b id="clock">--:--:-- WIB</b><span id="date">--</span></div></header><main class="notes" id="notes"></main></div>
<script>(()=>{const KEY='taktiksaham_live_notes_v1',CHAN='taktiksaham-live-notes',bc=('BroadcastChannel'in window)?new BroadcastChannel(CHAN):null;let s={title:'LIVE MARKET NOTES',subtitle:'Saham yang sedang dibahas — bukan ajakan beli/jual',status:'live',notes:[]};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){$('status').textContent=(s.status||'live').toUpperCase();$('title').textContent=s.title||'LIVE MARKET NOTES';$('subtitle').textContent=s.subtitle||'';$('notes').innerHTML=s.notes?.length?s.notes.map(x=>`<article class="note"><div class="ticker">${esc(x.ticker)}</div><div class="stance">${esc(x.stance)}</div><div class="level">${esc(x.level||'—')}</div><div class="note-text">${esc(x.note||'')}</div></article>`).join(''):'<div class="empty">Menunggu catatan dari host…</div>'}function read(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)s={...s,...x}}catch(_){}render()}if(bc)bc.onmessage=e=>{if(e.data){s={...s,...e.data};render()}};addEventListener('storage',e=>{if(e.key===KEY)read()});function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'}).replaceAll('.',':')+' WIB';$('date').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric',timeZone:'Asia/Jakarta'})}tick();setInterval(tick,250);$('fs').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()};read()})();</script></body></html>
