name: TaktikSaham Auto Morning Update

on:
  schedule:
    - cron: "47 6 * * 1-5"
      timezone: "Asia/Jakarta"
    - cron: "17 8 * * 1-5"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-morning-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build morning market JSON
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: python scripts/update_morning_market.py

      - name: Commit updated market data
        shell: bash
        run: |
          if git diff --quiet -- data/morning-market.json; then
            echo "Tidak ada perubahan data."
            exit 0
          fi

          git config user.name "TaktikSaham Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add data/morning-market.json
          git commit -m "auto: morning market update"
          git push
