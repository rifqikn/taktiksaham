<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password • TaktikSaham</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#071a36,#0f3a6c);font-family:Inter,Arial,sans-serif}
.box{width:min(450px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.3)}h1{margin:0 0 8px;color:#0c315f;font-size:26px}p{color:#77889c;font-size:11px;line-height:1.6;margin:0 0 18px}label{display:block;color:#52657b;font-size:9px;font-weight:900;text-transform:uppercase;margin:0 0 6px}input{width:100%;height:47px;border:1px solid #dbe4ed;border-radius:11px;padding:0 12px;margin-bottom:12px;outline:none}button{width:100%;height:46px;border:0;border-radius:11px;background:#f58220;color:#10213d;font-weight:950;cursor:pointer}.msg{display:none;padding:10px;border-radius:10px;margin-bottom:12px;font-size:10px}.msg.show{display:block}.err{background:#ffeded;color:#a54444}.ok{background:#e6f8f0;color:#197b54}a{display:block;text-align:center;margin-top:14px;color:#d86b0b;font-size:10px;font-weight:900;text-decoration:none}
</style></head><body><div class="box"><h1>Buat Password Baru</h1><p>Halaman ini digunakan setelah kamu membuka link reset password dari email.</p><div id="msg" class="msg"></div><form id="form"><label>Password Baru</label><input id="p1" type="password" minlength="8" required><label>Ulangi Password</label><input id="p2" type="password" minlength="8" required><button type="submit">SIMPAN PASSWORD →</button></form><a href="index.html">← Kembali ke TaktikSaham</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const cfg=window.TS_SUPABASE_CONFIG||{};const msg=document.getElementById("msg");function show(t,c){msg.textContent=t;msg.className="msg show "+c}
if(!cfg.url||String(cfg.url).includes("PASTE_"))show("Supabase belum dikonfigurasi.","err");
else{const sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{detectSessionInUrl:true,persistSession:true}});document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const a=document.getElementById("p1").value,b=document.getElementById("p2").value;if(a!==b){show("Password belum sama.","err");return}const {error}=await sb.auth.updateUser({password:a});if(error)show(error.message,"err");else{show("Password berhasil diperbarui. Silakan login kembali.","ok");setTimeout(()=>location.href="index.html",1800)}})}
</script></body></html>
